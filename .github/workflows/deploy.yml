name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Configure socket URL
        run: |
          SOCKET_URL="${{ vars.SOCKET_URL }}"
          if [ -z "$SOCKET_URL" ]; then
            SOCKET_URL="http://localhost:3001"
          fi
          printf '{"socketUrl":"%s"}' "$SOCKET_URL" > client/dist/config.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - id: deploy
        uses: actions/deploy-pages@v4
